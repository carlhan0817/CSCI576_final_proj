[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "multimedia-segmentation"
version = "0.1.0"
description = "Multimodal Long-Form Video Segmentation System"
requires-python = ">=3.12"
dependencies = [
    # Core
    "numpy>=1.26",
    "pydantic>=2.6",

    # Media I/O (Phase 1)
    "ffmpeg-python>=0.2.0",
    "imageio-ffmpeg>=0.5.1",
    "opencv-python>=4.9",
    "Pillow>=10.0",

    # ASR (Phase 1)
    "faster-whisper>=1.0.3",

    # Phase 2: Visual features (CLIP)
    "torch==2.7.1",
    "torchaudio==2.7.1",
    "transformers>=4.40",

    # Phase 2: Audio spectral features
    "librosa>=0.10",

    # Phase 2: Text features (semantic embedding)
    "sentence-transformers>=2.7",
    "scikit-learn>=1.4",

    # Phase 3: OCR commercial-signal detection
    "rapidocr-onnxruntime>=1.3,<2.0",

    # Phase 4.5: Player backend
    "fastapi>=0.110",
    "uvicorn[standard]>=0.29",
    "python-multipart>=0.0.9",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-mock>=3.12",
    "httpx>=0.27",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["backend*"]

[tool.pytest.ini_options]
markers = [
    "slow: marks tests as slow (deselect with '-m \"not slow\"')",
]
testpaths = ["tests"]
